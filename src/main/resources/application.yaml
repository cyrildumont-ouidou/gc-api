spring:
  datasource:
    url: jdbc:h2:~/gc-database;MODE=PostgreSQL
  h2:
    console:
      enabled: true


management:
  endpoint:
    health:
      show-details: always
    server:
      port: 8888
  endpoints:
    web:
      exposure:
        include: "*"

  info:
    java:
      enabled: true
    git:
      enabled: true